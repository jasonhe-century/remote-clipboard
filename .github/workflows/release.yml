name: 发布

# 打 tag 即发布：git tag v0.1.1 && git push origin v0.1.1
# 也可以在 Actions 页面手动触发，默认是 dry run（只打包、不发布）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只打包不发布（用来验证流水线）
        type: boolean
        default: true

permissions:
  contents: write # 建 Release 需要

jobs:
  publish:
    name: 打包并发布
    runs-on: ubuntu-latest
    env:
      # 在 job 级中转一下，好让下面的 step 能在 if 里判断它是否为空
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Marketplace 不允许重发同一个版本号，所以版本对不上就必须提前失败
      - name: 校验 tag 与 package.json 版本一致
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=remote-clipboard-image-$version.vsix" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json 里的 $version 不一致"
            exit 1
          fi
          echo "将发布版本 $version"

      # vsce package 会先跑 vscode:prepublish（也就是 tsc），编译不过这里就断
      - name: 打包 vsix
        env:
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: npx vsce package --no-dependencies -o "$VSIX"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          if-no-files-found: error

      # 后面三步统一用 --packagePath 发布同一个产物，保证发到两个市场、
      # 挂到 Release 上的三份文件字节完全一致
      - name: 发布到 VS Code Marketplace
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: npx vsce publish --packagePath "$VSIX"

      # 没配 OVSX_PAT 就整步跳过，不让它拖垮整个发布
      - name: 发布到 Open VSX
        if: ${{ (github.event_name == 'push' || !inputs.dry_run) && env.OVSX_PAT != '' }}
        env:
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: npx ovsx publish "$VSIX" -p "$OVSX_PAT"

      - name: 从 CHANGELOG 提取本版本的更新说明
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf '本版本在 CHANGELOG.md 中没有对应条目。\n' > release-notes.md
          fi
          cat release-notes.md

      - name: 创建 GitHub Release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$VSIX" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --verify-tag
